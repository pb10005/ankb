# FEAT-007 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: docs/instructions.md（ankb 実装指示書）§10 ステップ7 / §7.1 / UC4
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-007
title: "サーバMCP: 外部エージェントがユーザー本人の権限で読み書きする"
status: draft # draft -> (spec-lint --gate freeze) -> frozen

intent: "翔が Claude Code での実装中に仕様や設計判断を参照できるように、ankb を Streamable HTTP のMCPサーバとして公開する。外部エージェントはOAuthで得たユーザー本人のトークンで動き、Web UI と同じ検索関数・同じRLSを通る。承認・公開範囲の変更・削除はツールとして提供しない。"

out_of_scope:
  - "リアルタイム共同編集（指示書 §11）"
  - "外部サービス（Slack / Google Drive）からの自動取り込み（指示書 §11）"
  - "view / edit より細かいロール（指示書 §11）"
  - "ネイティブモバイルアプリ（指示書 §11）"
  - "ノートの物理削除。v1 は status=archived のみ（指示書 §11）"
  - "stdio トランスポート"
  - "resolve_relation（承認）・公開範囲の変更・ノート削除のMCPツール（指示書 §7.1）"
  - "APIキー（長期トークン）による認証。認証はOAuthのみ"
  - "MCPのリソース・プロンプト機能。ツールだけを公開する"

assumptions:
  - id: AS-024
    statement: "MCPエンドポイントは Next.js の Route Handler（/mcp）として同じアプリに置き、@modelcontextprotocol/sdk の Streamable HTTP をステートレスで動かす。認可サーバは Supabase Auth の OAuth 2.1 サーバ機能を使い、ankb はリソースサーバとして Protected Resource Metadata を公開してトークン（Supabase の JWT）を検証する。受け取ったJWTをそのまま Supabase クライアントに渡し、RLS を効かせる"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-025
    statement: "エラーは isError: true の結果として返し、先頭テキストを JSON {code, message} とする。code は VALIDATION_ERROR | NOT_FOUND | FORBIDDEN | CONFLICT。閲覧できないノートは FORBIDDEN ではなく NOT_FOUND を返す（存在を漏らさない）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-026
    statement: "list_pending_relations は、呼び出したユーザーが両方のノートの編集権限を持つ proposed の提案だけを返す"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"

open_questions: []

