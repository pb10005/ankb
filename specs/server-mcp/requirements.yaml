    kind: functional
    given: "OAuthで認可済みの翔のトークン"
    when: "tools/list を呼ぶ"
    then: "search_knowledge / ask / get_note / get_note_lineage / list_pending_relations / create_note / update_note / propose_relation の8件だけを返す"
    priority: must
    verify: test
    status: pending
    attempts: 0

