# FEAT-005 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: docs/instructions.md（ankb 実装指示書）§10 ステップ5 / §6.3 / §6.4
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-005
title: "サーバ合成 ask: 回答の契約をサーバ側で強制する"
status: frozen # draft -> (spec-lint --gate freeze) -> frozen

intent: "散らばった断片から、今有効な答えを根拠付きで組み立てる（§1.2）。サーバが検索パイプラインの結果だけを材料に Claude で回答を合成し、すべての主張に根拠ノートを付け、旧情報・矛盾・更新の可能性を区別して返す。美咲が回答の正しさを自分で判断できなくても、どれが現行でどこに書いてあるかが画面で分かる状態を作る。"

out_of_scope:
  - "リアルタイム共同編集（指示書 §11）"
  - "外部サービス（Slack / Google Drive）からの自動取り込み（指示書 §11）"
  - "view / edit より細かいロール（指示書 §11）"
  - "ネイティブモバイルアプリ（指示書 §11）"
  - "ノートの物理削除。v1 は status=archived のみ（指示書 §11）"
  - "回答の会話履歴（追質問の文脈保持）。1質問1回答とする"
  - "回答のストリーミング表示"
  - "回答へのフィードバック（良い／悪い）の収集"
  - "BYO（利用者持ち込み）APIキー。v1 はサーバ運用者の ANTHROPIC_API_KEY を使う（AS-058）"

assumptions:
  - id: AS-017
    statement: "Claude には自由文ではなく構造化出力（tool use の JSON スキーマ）で claims:[{text, note_ids[], kind: current|outdated|conflict|timeline, date?}] と not_found を出させる。answer 文字列・引用マーカー・citations はサーバが claims から決定的に組み立てる。検索結果に無い note_id を引用した claim と、note_ids が空の claim は捨てる"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-018
    statement: "合成に使うモデルは claude-opus-5 を既定とし、環境変数 ANKB_ANSWER_MODEL で変更できる。claude-opus-5 は temperature を受け付けないため指定しない（出力の揺れは構造化出力とサーバ側の組み立てで抑える: AS-017）。拒否に備えて server-side fallback（fallbacks: default）を付ける"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-09-26"
  - id: AS-046
    statement: "LLM に渡すのは searchKnowledge の結果（hits / superseded_context / conflicts）のチャンクだけとする。superseded_context のノートを kind=current で引用した claim は kind=outdated に降格して outdated_mentions に回す。conflicts がある場合、片方だけを current で引用していても、サーバが両方のマーカーを併記する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-047
    statement: "not_found の『近い情報』は、LLM が not_found=true を返した時に検索結果の hits 上位最大3件とし、検索ヒットが0件の場合は併記しない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-058
    statement: "embedding は Voyage AI の多言語モデルを使う。LLM（Anthropic API）と embedding の利用料はサーバ運用者の API キー（ANTHROPIC_API_KEY / VOYAGE_API_KEY）で負担し、BYO キーは v1 で扱わない。ask にはユーザーあたりの回数上限を設ける（FEAT-007 AS-054）（OQ-002 を 2026-09-25 に既定案で確定）"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-09-25"
  - id: AS-071
    statement: "Answer 型（§7.3）に format（standard | timeline）を加え、経緯形式で答えたかどうかを返す。superseded のノートを根拠に含む claim は、現行のノートを併せて引いていても旧情報に降格し、answer に「（旧情報）」を付けて残し引用マーカーは付けない（根拠は outdated_mentions の note_id・タイトルで示す）。LLM が kind=outdated とした claim は根拠のマーカーを付けたうえで「（旧情報）」を付ける。superseded_context のノートは claim に引かれていなくても、not_found の場合も outdated_mentions に入れる。契約を満たす主張が1件も残らなければ、食い違いがあっても not_found=true とする"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"

open_questions: []

