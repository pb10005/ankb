# FEAT-009 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: docs/instructions.md（ankb 実装指示書）§10 ステップ2 / §4.2 / §4.3 / §5.2-4
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-009
title: "ノートの状態遷移: superseded は承認経由でしか起きず、見えない相手の情報を漏らさない"
status: frozen # draft -> (spec-lint --gate freeze) -> frozen

intent: "『どれが今有効か』の判定は ankb の価値の中核であり、superseded
  への遷移が承認以外の経路で起きれば、旧情報を現行として回答する事故に直結する。note_relation と notes の状態遷移を DB のトリガーと
  RPC に閉じ込め、承認・取り消し・多重の置き換え・循環を決定的に扱い、閲覧できない置き換え先の id を列の値から漏らさないようにする。"

out_of_scope:
  - "リアルタイム共同編集（指示書 §11）"
  - "外部サービス（Slack / Google Drive）からの自動取り込み（指示書 §11）"
  - "view / edit より細かいロール（指示書 §11）"
  - "ネイティブモバイルアプリ（指示書 §11）"
  - "ノートの物理削除。v1 は status=archived のみ（指示書 §11）"
  - "contradicts / related 関係の状態遷移に伴うノートの status 変更（contradicts を承認しても両ノートは
    active のまま）"
  - "置き換え関係の一括インポート"

assumptions:
  - id: AS-032
    statement: "notes.superseded_by 列は authenticated ロールに直接公開しない。読み出しはビュー
      notes_visible（security_invoker）経由とし、置き換え先を can_view_note で判定して閲覧できない場合は
      null を返す"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-033
    statement: "note_relation.state の遷移は
      proposed→confirmed、proposed→rejected、confirmed→rejected（取り消し）の3つだけとし、すべて
      resolve_relation(relation_id, decision: confirm|reject|revoke)
      で行う。rejected は終端"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-034
    statement: "1つのノートを複数のノートが confirmed で置き換えている場合、superseded_by は最後に承認された関係の from
      とする。取り消しで confirmed の置き換えが無くなった時だけ active に戻す"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-035
    statement: "supersedes の承認は、置き換え対象が active または superseded、置き換え元が active
      の場合だけ許す。confirmed の supersedes をたどって循環になる承認は拒否する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-036
    statement: "resolve_relation は対象行を SELECT ... FOR UPDATE でロックし、state が期待値でなければ
      ALREADY_RESOLVED を返す"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-045
    statement: "superseded のノートも編集できるが、status は変わらず推定ジョブも起動しない。置き換え先が archived
      になっても置き換えられた側は superseded のまま"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-063
    statement: "notes.status の直接の遷移は draft→active、draft→archived、active→archived
      の3つだけとし、archived は v1 では終端（アーカイブの解除は無い）とする。superseded
      のノートは置き換えを取り消すまでアーカイブできない"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-09-26"
  - id: AS-064
    statement: "置き換えの承認・取り消しによる status / superseded_by の変更（状態遷移トリガー経由）では version と
      updated_at を変えない。version は本文・タイトル・公開範囲の編集に対する楽観ロック（AS-052）にだけ使う"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-09-26"
  - id: AS-065
    statement: "note_relation の proposed_by=ai
      はバックグラウンドジョブ（サービスロール）だけが作れる。利用者のトークンで作れる提案は user / agent のみとし、提案者を
      created_by に記録する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"

open_questions: []

