# FEAT-001 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: docs/instructions.md（ankb 実装指示書）§10 ステップ1 / §3
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-001
title: "雛形: Next.js + Supabase の認証とCI"
status: frozen # draft -> (spec-lint --gate freeze) -> frozen

intent: "ankb の全機能（Web UI・サーバMCP・WebMCP）が乗る土台として、Next.js（App Router）と Supabase Auth によるログインと、lint・型チェック・テストを回すCIを用意する。ログインしたユーザーだけがダッシュボードに到達できる状態を完了とする。"

out_of_scope:
  - "リアルタイム共同編集（指示書 §11）"
  - "外部サービス（Slack / Google Drive）からの自動取り込み（指示書 §11）"
  - "view / edit より細かいロール（指示書 §11）"
  - "ネイティブモバイルアプリ（指示書 §11）"
  - "ノートの物理削除。v1 は status=archived のみ（指示書 §11）"
  - "ソーシャルログイン・SSO・多要素認証"
  - "パスワードリセット・メールアドレス変更の画面"
  - "workspace の作成・招待・メンバー管理の画面。v1 の workspace とメンバーはシードスクリプトで投入する（AS-003）"
  - "ノートへの次アクション・期限・見直し日の構造化フィールド（AS-057）"

assumptions:
  - id: AS-001
    statement: "ログイン方式は Supabase Auth のメールアドレス＋パスワードとする。マジックリンクは使わない（ローカル・CIでメール受信を介さずにテストできるため）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-002
    statement: "ローカル開発とCIは Supabase CLI（supabase start、Docker）で Postgres・Auth を起動する。テストフレームワークは単体・結合が Vitest、E2E が Playwright とする"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-003
    statement: "workspace・member・ユーザーは v1 ではシードスクリプト（supabase/seed）でのみ作成する。サインアップ画面は設けない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-055
    statement: "ログイン後の遷移先 next パラメータは / で始まる同一オリジンの相対パスだけを受け付け、// または /\\ で始まるもの、制御文字を含むものは /dashboard に置き換える"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-09-26"
  - id: AS-057
    statement: "当初の依頼にあった『のちのアクションに活用できる形で保管する』（ノートの次アクション・期限・見直し日の構造化）は v1 では扱わない。指示書 docs/instructions.md に従う（OQ-001 を 2026-09-25 に既定案で確定）"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-09-25"

open_questions: []

