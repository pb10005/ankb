# FEAT-001 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-001
title: "サーバサイドMCPによるアクション指向ナレッジストア"
status: draft # draft -> (spec-lint --gate freeze) -> frozen

# 誰のどの困りごとを解くのか。1文。実装判断に迷った時の最終的な拠り所になる。
intent: "ドメイン知識・計画書・決定事項は、Wikiやドキュメントに文章として置かれた時点で『次に何をするか』『なぜそう決めたか』『いつ見直すか』が本文に埋もれ、\
  後から人間もAIエージェントも行動に移せない。ankbはこれらを、次アクション・見直し期日・根拠・アイテム間の関係を構造化フィールドとして持つ形で保管し、\
  サーバサイドMCPのツールとして公開することで、MCPクライアント（Claude等のエージェント）が『未完了アクションの一覧』『見直し期限を過ぎた決定』\
  『この決定を置き換えた新しい決定』を問い合わせだけで引き出せるようにする。"

# 過剰実装を止める外周。draft を抜けるには最低1件必要。
# 「やらないと決めたこと」であって「将来やること」ではない。
out_of_scope:
  - "埋め込みベクトルによる意味検索・RAG。検索はSQLite FTS5の全文検索とフィルタに限定する"
  - "サーバ内部からのLLM呼び出し（要約・自動分類・自動タグ付け・アクション自動抽出）。知能はMCPクライアント側に置き、サーバは決定論的な保管・検索・整合性検査だけを担う（AS-003）"
  - "複数ユーザー・テナント分離・アイテム単位の権限管理。単一ユーザー（単一チーム共有の1トークン）を前提とする（AS-004）"
  - "アイテムの物理削除。削除はアーカイブ（status変更による論理削除）のみとする"
  - "アイテムの変更履歴の閲覧・差分表示・過去版への巻き戻し。保持するのは現在版と version 番号のみ"
  - "ファイル添付・画像の保存。本文はMarkdownテキストのみ"
  - "外部サービス（Notion/Confluence/Google Docs/Linear）からのインポート・同期"
  - "stdioトランスポート。MCPの公開はStreamable HTTP（POST /mcp）のみとする"
  - "アクションの担当者割り当て・通知（メール/Slack/プッシュ）。期限の到来はクエリで引き出すだけで、サーバから能動的に通知しない"

# 確信が持てないまま進める判断。コード側に @assumption AS-001 を残して回収可能にする。
# owner と resolve_by が無い仮決めは、誰も確定させないまま本番に入る。
assumptions:
  - id: AS-001
    statement: "アイテムは type=knowledge|plan|decision の3種とし、全種共通で title(1〜200文字) / body(Markdown, 最大100,000文字) / tags(最大20個, 各1〜50文字) /\
      actions(次アクションの配列。各要素は id / text / due(任意, YYYY-MM-DD) / done) / review_at(任意, YYYY-MM-DD) / relations / version / created_at / updated_at を持つ。\
      statusは種別ごとに knowledge: active|deprecated|archived、plan: draft|active|done|cancelled|archived、decision: proposed|accepted|superseded|rejected|archived とする。\
      decision は rationale(根拠, 1文字以上) を必須とする"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-002
    statement: "永続化は Node 標準の node:sqlite による単一ファイルSQLiteとし、パスは環境変数 ANKB_DB_PATH（既定 ./ankb.db）。全文検索はFTS5のtrigramトークナイザを使い、\
      3文字未満のクエリは LIKE による部分一致にフォールバックする（日本語の2文字語『認証』『計画』を取りこぼさないため）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-003
    statement: "サーバはLLMを呼び出さない。要約・分類・アクション抽出はMCPクライアント側のエージェントが行い、サーバはその結果を構造化フィールドとして受け取り検証・保存する。\
      これによりサーバはAPIキー不要・決定論的にテスト可能になる"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-004
    statement: "認証は単一の共有Bearerトークン。環境変数 ANKB_TOKEN が設定されている場合のみ /mcp に Authorization: Bearer <token> を要求し、未設定の場合は 127.0.0.1 にのみbindして認証なしで受け付ける"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-005
    statement: "MCPサーバは @modelcontextprotocol/sdk の Streamable HTTP をステートレス・JSONレスポンスモード（enableJsonResponse）で動かす。\
      ブラウザ側（FEAT-002）がSDKのバンドル無しに fetch だけでJSON-RPCを呼べるようにするため"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-006
    statement: "ツールのエラーはMCPの isError: true の結果として返し、先頭のテキストを JSON {code, message} とする。code は VALIDATION_ERROR | NOT_FOUND | CONFLICT の3種"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-007
    statement: "公開するMCPツールは kb_create_item / kb_get_item / kb_update_item / kb_search / kb_link_items / kb_list_actions / kb_complete_action / kb_due_reviews の8種。\
      relations の種別は supersedes | depends_on | derived_from | relates_to の4種"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-008
    statement: "日付の比較はサーバのローカルタイムゾーンではなくUTCの暦日で行う。kb_list_actions / kb_due_reviews は引数 as_of(YYYY-MM-DD, 既定はUTCの今日) を基準日とする"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"

# 人間の判断が要る未決事項。frozen にするには空にする（確定させるか assumptions へ降格）。
open_questions:
  - id: OQ-001
    question: "アイテムの型を knowledge / plan / decision の3種＋共通の行動フィールド（actions / review_at / relations / decisionのrationale必須）とする設計（AS-001）でよいか"
    default: "AS-001 のとおり3種＋共通の行動フィールドで進める"
    raised: "2026-09-25"
    status: open
  - id: OQ-002
    question: "保存先を単一ファイルSQLite（AS-002）とするか、Gitで差分管理できるMarkdown+frontmatterのファイル群とするか"
    default: "単一ファイルSQLiteで進める"
    raised: "2026-09-25"
    status: open
  - id: OQ-003
    question: "サーバはLLMを呼ばず、知能はMCPクライアント側に置く設計（AS-003）でよいか"
    default: "サーバはLLMを呼ばない"
    raised: "2026-09-25"
    status: open

# 受入基準。ハッピーパスだけ書くと必ず後で破綻するので、異常系を必ず1件以上入れる。
# then には外から観測できる結果を書く（返す/表示/保存/拒否…）。「対応する」「できる」は不可。
acceptance:
  - id: AC-001
    kind: functional
    given: "空のナレッジベース"
    when: "kb_create_item を type=decision, title, body, rationale, actions 1件付きで呼ぶ"
    then: "id と version=1 を含むアイテムを返し、その id で kb_get_item を呼ぶと同じ title / rationale / actions を返す"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-002
    kind: functional
    given: "空のナレッジベース"
    when: "kb_create_item を (a) type=decision で rationale 省略、(b) title が空文字、(c) title が201文字 のいずれかで呼ぶ"
    then: "3ケースとも isError の結果で code=VALIDATION_ERROR を返し、アイテムは保存されない（kb_search の件数が0のまま変わらない）"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-003
    kind: functional
    given: "アクションを1件持つアイテム X"
    when: "(a) 存在しない id で kb_get_item を呼ぶ、(b) X の id と存在しないアクション id で kb_complete_action を呼ぶ"
    then: "両ケースとも isError の結果で code=NOT_FOUND を返し、X の version は変わらない"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-004
    kind: functional
    given: "version=1 のアイテム"
    when: "kb_update_item を expected_version=1 で title を変更して呼ぶ"
    then: "変更後の title と version=2 を返す"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-005
    kind: functional
    given: "version=2 のアイテム"
    when: "kb_update_item を expected_version=1 で呼ぶ"
    then: "isError の結果で code=CONFLICT を返し、保存済みのアイテムの内容と version=2 は変わらない"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-006
    kind: functional
    given: "本文に『認証方式はOAuthに統一する』を含む decision と、含まない knowledge が保存されている"
    when: "kb_search を query='認証'（2文字）と query='OAuth'（5文字）でそれぞれ呼ぶ"
    then: "両クエリとも decision のみを含む結果を返す"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-007
    kind: functional
    given: "type=plan 2件（うち1件が status=archived）と type=decision 1件が保存されている"
    when: "kb_search を query 無し・type=plan で呼ぶ"
    then: "archived でない type=plan の1件だけを返す"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-008
    kind: functional
    given: "due=2026-10-01 と due=2026-09-20 の未完了アクション、および done=true のアクションを持つアイテム群"
    when: "kb_list_actions を as_of=2026-09-25 で呼ぶ"
    then: "未完了アクション2件だけを due の昇順で返し、各要素に所属アイテムの id / title と overdue フラグ（2026-09-20 の方のみ true）を含む"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-009
    kind: functional
    given: "未完了アクションを1件持つアイテム"
    when: "kb_complete_action をそのアイテム id とアクション id で呼ぶ"
    then: "以後の kb_list_actions はそのアクションを含まない結果を返す"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-010
    kind: functional
    given: "review_at=2026-09-01 の decision と review_at=2026-12-01 の decision"
    when: "kb_due_reviews を as_of=2026-09-25 で呼ぶ"
    then: "review_at=2026-09-01 の decision のみを返す"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-011
    kind: functional
    given: "status=accepted の decision A と、新しい decision B"
    when: "kb_link_items を from=B, to=A, type=supersedes で呼ぶ"
    then: "以後の kb_get_item(A) が status=superseded と superseded_by=B の id を返す"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-012
    kind: functional
    given: "存在するアイテム X"
    when: "kb_link_items を (a) from=X, to=存在しない id、(b) from=X, to=X で呼ぶ"
    then: "(a) は code=NOT_FOUND、(b) は code=VALIDATION_ERROR の isError 結果を返し、X の relations は変わらない"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-013
    kind: functional
    given: "環境変数 ANKB_TOKEN を設定して起動したサーバ"
    when: "Authorization ヘッダ無し、または異なるトークンで POST /mcp を送る"
    then: "HTTP 401 を返し、ツールは実行されない（アイテム件数が変わらない）"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-014
    kind: functional
    given: "ANKB_DB_PATH で指定したファイルにアイテムを1件保存したサーバ"
    when: "サーバを停止し、同じ ANKB_DB_PATH で再起動して kb_get_item を呼ぶ"
    then: "停止前と同じ title と version を返す"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-015
    kind: nfr
    given: "10,000件のアイテムを保存したナレッジベース（CI の ubuntu-latest 相当）"
    when: "kb_search を 3文字以上の query で100回呼ぶ"
    then: "p95 応答時間が 200ms 以下である"
    priority: should
    verify: test
    status: pending
    attempts: 0
