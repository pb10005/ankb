# FEAT-002 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: docs/instructions.md（ankb 実装指示書）§10 ステップ2 / §4 / §5
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-002
title: "スキーマとRLS: ノートの閲覧・編集権限をDBで強制する"
status: frozen # draft -> (spec-lint --gate freeze) -> frozen

intent: "権限と有効性の判定を入口ごとの実装に任せると、Web UI・サーバMCP・WebMCP のどれか1つの抜けが情報漏洩になる。§4 のテーブルと
  §5 の権限モデルを Postgres の RLS とトリガーで強制し、どの入口から読んでも閲覧できないノートが1行も返らず、superseded
  への遷移が承認経由でしか起きない状態を作る。"

out_of_scope:
  - "リアルタイム共同編集（指示書 §11）"
  - "外部サービス（Slack / Google Drive）からの自動取り込み（指示書 §11）"
  - "view / edit より細かいロール（指示書 §11）"
  - "ネイティブモバイルアプリ（指示書 §11）"
  - "ノートの物理削除。v1 は status=archived のみ（指示書 §11）"
  - "workspace を跨いだノート共有。note_share の共有先は同じ workspace のメンバーに限る（AS-006）"
  - "権限の監査ログ（誰がいつ閲覧したか）"
  - "note_share の permission 以外の細かい権限（コメントのみ）"

assumptions:
  - id: AS-004
    statement: "RLS は Supabase の auth.uid() を基準に書く。閲覧可否は SQL 関数
      can_view_note(note_id) / can_edit_note(note_id)
      に一本化し、notes・note_chunk・note_version・note_relation の各ポリシーはこの関数を呼ぶ"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-005
    statement: "superseded への遷移と superseded_by の更新は note_relation の state
      変更トリガー（SECURITY DEFINER）だけが行う。notes への直接 UPDATE で status=superseded
      にする操作はトリガーで拒否する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-006
    statement: "workspace を跨いだ共有は許さない。note_share の共有先ユーザーは、ノートの workspace の member
      に限る（指示書 §12 の未決を既定値で仮決め）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-007
    statement: "note_relation の state を confirmed / rejected に変える操作は、RPC
      resolve_relation(relation_id, decision) を通してのみ行う。DB
      は呼び出し元が人間かエージェントかを区別できないため、『エージェントは承認できない』はサーバMCP・WebMCP
      にこのツールを載せないことで担保する（FEAT-007 / FEAT-008）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-008
    statement: "visibility の変更はオーナーのみが行える。edit 共有されたユーザーは body・title を編集できるが
      visibility と note_share は変更できない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-038
    statement: "draft のノートは visibility
      に従って閲覧できる（直接リンク・get_note）が、オーナー以外の検索結果には出さない。§4.2
      は検索についてだけ定めており、閲覧権限（§5、変更禁止）は変えない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-041
    statement: "note_chunk / note_version の INSERT・UPDATE（note_chunk は DELETE も）は
      can_edit_note(note_id) を満たすユーザーだけに許す。note_share と member の書き込みは、note_share
      はノートのオーナー、member は workspace の owner だけに許す"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-066
    statement: "member の行は本人の行しか SELECT できない（自己参照ポリシーの再帰を避けるため）。同僚の一覧は
      workspace_directory ビュー（FEAT-003 AS-060）で引く。ノートを所有するメンバーは FK により member
      から削除できない（v1 はメンバー管理画面を持たない: AS-003）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"

open_questions: []

