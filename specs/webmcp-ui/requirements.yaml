# FEAT-002 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-002
title: "WebMCPでエージェントに操作可能なナレッジベースUI"
status: draft # draft -> (spec-lint --gate freeze) -> frozen

# 誰のどの困りごとを解くのか。1文。実装判断に迷った時の最終的な拠り所になる。
intent: "人間がブラウザでankbを見ている最中に、ブラウザ内のAIエージェントへ『この決定に関連する未完了アクションを出して』と頼んでも、\
  エージェントは画面をスクレイピングするしかなく、結果も人間の画面に反映されない。ankbのWebフロントエンドは、自身の操作をWebMCP\
  （navigator.modelContext）のツールとして公開し、エージェントの検索・閲覧・作成が人間の見ている画面にそのまま表示されるようにする。\
  書き込みは人間が画面上で承認するまで確定しない。"

# 過剰実装を止める外周。draft を抜けるには最低1件必要。
# 「やらないと決めたこと」であって「将来やること」ではない。
out_of_scope:
  - "フロントエンドフレームワーク（React/Vue/Svelte）とバンドラの導入。素のTypeScriptをNodeの型除去で配信可能なES Moduleとして書く（AS-010）"
  - "WebMCPのポリフィル・独自拡張の同梱。navigator.modelContext が無いブラウザではエージェント向けツールを公開しない"
  - "Markdownの書式付きエディタ・WYSIWYG・プレビュー。本文は textarea で編集し、表示はプレーンテキスト"
  - "ログイン画面・ユーザー管理画面。ANKB_TOKEN 設定時はトークン入力欄に1度入力させ sessionStorage に保持するだけとする"
  - "オフライン動作・Service Worker・楽観的更新のローカルキャッシュ"
  - "モバイル専用レイアウト。幅360px以上で横スクロールが発生しないことだけを保証する"
  - "英語UI・多言語化。UI文言は日本語のみ"
  - "サーバ側MCPツール全9種の網羅的な公開。WebMCPで公開するのは AS-009 の5種のみ"
  - "UIからのアイテム更新・関係付け・見直し期限一覧（kb_update_item / kb_link_items / kb_unlink_items / kb_due_reviews）。FEAT-002では画面を作らず、MCPクライアントから直接操作する"
  - "CDP（DevTools Protocol）経由の isTrusted=true な合成入力による承認の偽装の防止。ブラウザ拡張型エージェントがこれを行えることは既知の残存リスクとして AS-018 に記録する"

# 確信が持てないまま進める判断。コード側に @assumption AS-001 を残して回収可能にする。
# owner と resolve_by が無い仮決めは、誰も確定させないまま本番に入る。
assumptions:
  - id: AS-009
    statement: "WebMCPで公開するツールは ankb_search / ankb_get_item / ankb_create_item / ankb_list_actions / ankb_complete_action の5種。\
      各ツールは navigator.modelContext.registerTool({name, description, inputSchema, execute}) で登録し、execute はバックエンドの対応するMCPツール\
      （kb_search 他）を呼んだ結果を {content:[{type:'text', text}]} で返す"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-010
    statement: "フロントエンドはバックエンドと同じNodeプロセスが GET / と GET /app/*.js で配信する。ブラウザからバックエンドへは fetch で POST /mcp に\
      JSON-RPC（tools/call）を直接送り、MCP SDKのブラウザバンドルは使わない（AS-005 のJSONレスポンスモードに依存）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-011
    statement: "エージェント由来の書き込み（ankb_create_item / ankb_complete_action）は、画面に確認ダイアログを表示し、人間が『承認』を押した時だけバックエンドへ送る。\
      『却下』または60秒無操作の場合は送らず、ツール結果として isError とテキスト USER_REJECTED を返す。人間自身のUI操作による書き込みは確認しない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-012
    statement: "E2Eテストは @playwright/test とプリインストール済みChromiumで行い、navigator.modelContext はテスト側で addInitScript により\
      registerTool 呼び出しを記録するスタブを注入して検証する（実ブラウザのWebMCP実装の有無に依存しない）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"

# 人間の判断が要る未決事項。frozen にするには空にする（確定させるか assumptions へ降格）。
  - id: AS-013
    statement: "アイテム由来の文字列（title / body / tags / actions.text / rationale）はDOMへ textContent でのみ挿入し、innerHTML / insertAdjacentHTML を使わない。プロンプトインジェクションされたエージェントが書き込んだ文字列で sessionStorage のトークンを持ち出させないため"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-014
    statement: "『期限切れ』はバックエンド kb_list_actions の overdue フラグ（FEAT-003 AS-008、UTC暦日基準）だけで決め、フロントエンドは日付計算をしない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-015
    statement: "確認ダイアログの表示中に届いた2件目の書き込み execute はキューに積まず、即座に isError とテキスト BUSY を返す。ダイアログ表示中のリロード・遷移は却下扱い（何も送信しない）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-016
    statement: "バックエンドのツールエラー（FEAT-001 AS-006 の {code, message}）は ankb_* の結果として isError 付きでそのまま返す。HTTP 401 の場合は isError と AUTH_REQUIRED を返し、画面にトークン入力欄と『トークンが違います』を表示して sessionStorage のトークンを消去する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-017
    statement: "エージェントによる ankb_search / ankb_get_item の実行結果は画面の一覧・詳細表示を置き換え、検索欄にそのクエリと『エージェントによる検索』の表示を出す。ankb_search の limit は既定20・最大100（kb_search と同じ）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-018
    statement: "承認・却下ボタンは isTrusted=false のイベント（element.click() / dispatchEvent）を無視する。CDP経由の合成入力は isTrusted=true になるためこの対策では防げず、残存リスクとして受容する。WebMCP提案の client.requestUserInteraction() がブラウザ実装に存在する場合はそちらの採用を再検討する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-019
    statement: "navigator.modelContext が存在しても registerTool が関数でない、または呼び出しが例外を投げた場合は『WebMCP: 無効』表示に切り替え、人間向けUIは動作を続ける。登録成功時はヘッダに『WebMCP: 有効』を表示する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"

open_questions: []

# 受入基準。ハッピーパスだけ書くと必ず後で破綻するので、異常系を必ず1件以上入れる。
# then には外から観測できる結果を書く（返す/表示/保存/拒否…）。「対応する」「できる」は不可。
acceptance:
