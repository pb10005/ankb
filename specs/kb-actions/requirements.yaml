# FEAT-003 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-003
title: "アクション・見直し期日・決定の置き換えを扱うMCPツール"
status: draft # draft -> (spec-lint --gate freeze) -> frozen

# 誰のどの困りごとを解くのか。1文。実装判断に迷った時の最終的な拠り所になる。
intent: "ankbに保管した計画・決定を『次に何をするか』『いつ見直すか』『今も有効か』の観点で引き出せなければ、構造化して保管した意味が無い。\
  本機能は FEAT-001 のアイテムに対し、未完了アクションの横断一覧・アクションの完了・見直し期限到来の一覧・決定の置き換え（supersedes）と\
  その取り消しをMCPツールとして提供し、エージェントが問い合わせ1回で行動の起点を得られるようにする。"

# 過剰実装を止める外周。draft を抜けるには最低1件必要。
# 「やらないと決めたこと」であって「将来やること」ではない。
out_of_scope:
  - "アクションの担当者・優先度・見積もり・サブタスク。アクションは text / due / done だけを持つ"
  - "期限到来・見直し期日到来のプッシュ通知・メール・Webhook。一覧はクエリで引き出すだけとする"
  - "繰り返しアクション（毎週・毎月）と review_at の自動再設定"
  - "関係グラフの可視化・推移的な依存解決（depends_on の連鎖をたどった影響分析）"
  - "完了済みアクションの未完了への差し戻し（done=true → false）"

# 確信が持てないまま進める判断。コード側に @assumption AS-001 を残して回収可能にする。
# owner と resolve_by が無い仮決めは、誰も確定させないまま本番に入る。
assumptions:
  - id: AS-008
    statement: "日付の比較はサーバのローカルタイムゾーンではなくUTCの暦日で行う。kb_list_actions / kb_due_reviews は引数 as_of(YYYY-MM-DD, 既定はUTCの今日) を基準日とする。\
      アクションの overdue は due < as_of（当日は含まない）、見直しの到来は review_at <= as_of（当日を含む）とする"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-020
    statement: "アクション id はサーバが採番する。kb_update_item に渡す actions は、既存 id を持つ要素は text / due を更新、id の無い要素は追加、渡されなかった既存 id は削除とする。\
      done は kb_complete_action でしか変更できない（kb_update_item で done を渡しても無視する）。kb_complete_action は成功時に version を1上げ、既に done のアクションに対しては\
      エラーにせず version を上げずに現在のアイテムを返す（idempotent）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-021
    statement: "kb_list_actions は全種別のアイテムを対象とし、終了状態（archived / done / cancelled / superseded / rejected / deprecated）のアイテムのアクションは含めない。\
      並びは due の昇順で、due の無いアクションは末尾に置く。kb_due_reviews も全種別を対象とし、同じ終了状態のアイテムは含めない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-024
    statement: "relations の種別は supersedes | depends_on | derived_from | relates_to の4種。supersedes は from / to がともに decision の場合だけ受け付け、\
      リンクした時点で to の status を superseded に変え、元の status を保持する。kb_unlink_items で supersedes を外すと、to の status を保持していた元の status に戻す。\
      同一 (from, to, type) の再リンクはエラーにせず relations を増やさない（idempotent）。supersedes の循環（A→B がある状態での B→A）は拒否する。\
      superseded の decision の status を kb_update_item で変更することは拒否する（戻すには unlink を使う）。リンク・アンリンクは from と to の両方の version を1上げる"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"

# 人間の判断が要る未決事項。frozen にするには空にする（確定させるか assumptions へ降格）。
open_questions: []

# 受入基準。ハッピーパスだけ書くと必ず後で破綻するので、異常系を必ず1件以上入れる。
# then には外から観測できる結果を書く（返す/表示/保存/拒否…）。「対応する」「できる」は不可。
acceptance:
  - id: AC-008
    kind: functional
    given: "due=2026-10-01 と due=2026-09-20 の未完了アクション、および done=true のアクションを持つ active な plan"
    when: "kb_list_actions を as_of=2026-09-25 で呼ぶ"
    then: "未完了アクション2件だけを due の昇順で返し、各要素に所属アイテムの id / title と overdue フラグ（2026-09-20 の方のみ true）を含む"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-036
    kind: functional
    given: "active な plan に due=2026-09-25 のアクションと due 無しのアクション、archived の plan に due=2026-09-01 のアクションがある"
    when: "kb_list_actions を as_of=2026-09-25 で呼ぶ"
    then: "archived の plan のアクションを含まない2件を返す。先頭は due=2026-09-25・overdue=false のもの、末尾は due 無しのもの"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-009
    kind: functional
    given: "未完了アクションを1件持つ version=1 のアイテム"
    when: "kb_complete_action をそのアイテム id とアクション id で2回続けて呼ぶ"
    then: "1回目・2回目とも done=true と version=2 のアイテムを返し、以後の kb_list_actions はそのアクションを含まない結果を返す"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-037
    kind: functional
    given: "アクションを1件持つアイテム X"
    when: "kb_complete_action を (a) 存在しないアイテム id、(b) X の id と存在しないアクション id で呼ぶ"
    then: "両ケースとも isError の結果で code=NOT_FOUND を返し、X の version は変わらない"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-038
    kind: functional
    given: "アクション a1（done=true）と a2 を持つアイテム"
    when: "kb_update_item の actions に a1 の id で text を変更した要素と id 無しの新しい要素を渡し、a2 を渡さない"
    then: "a1 は同じ id・変更後の text・done=true のまま、新しい要素はサーバ採番の id 付きで保存され、a2 は保存されていない状態のアイテムを返す"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-010
    kind: functional
    given: "review_at=2026-09-25 の accepted decision、review_at=2026-09-01 の active plan、review_at=2026-09-01 の archived knowledge、review_at=2026-12-01 の decision"
    when: "kb_due_reviews を as_of=2026-09-25 で呼ぶ"
    then: "accepted decision と active plan の2件だけを返す"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-011
    kind: functional
    given: "status=accepted の decision A と、新しい decision B"
    when: "kb_link_items を from=B, to=A, type=supersedes で呼ぶ"
    then: "以後の kb_get_item(A) が status=superseded と superseded_by=B の id を返す"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-039
    kind: functional
    given: "B→A の supersedes により status=superseded になった decision A（リンク前は accepted）"
    when: "kb_unlink_items を from=B, to=A, type=supersedes で呼ぶ"
    then: "以後の kb_get_item(A) は superseded_by を含まず status=accepted のアイテムを返す"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-012
    kind: functional
    given: "存在するアイテム X"
    when: "kb_link_items を (a) from=X, to=存在しない id、(b) from=X, to=X で呼ぶ"
    then: "(a) は code=NOT_FOUND、(b) は code=VALIDATION_ERROR の isError 結果を返し、X の relations は変わらない"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-040
    kind: functional
    given: "accepted の decision A と B、および knowledge K、B→A の supersedes リンク"
    when: "kb_link_items を (a) from=B, to=K, type=supersedes、(b) from=A, to=B, type=supersedes（循環）で呼ぶ"
    then: "両ケースとも isError の結果で code=VALIDATION_ERROR を返し、A / B / K の relations と status は変わらない"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-041
    kind: functional
    given: "B→A の supersedes リンクがある状態"
    when: "(a) kb_link_items を同じ from=B, to=A, type=supersedes でもう一度呼ぶ、(b) kb_update_item で A の status を accepted に変更する"
    then: "(a) は isError にならず B の relations は1件のまま、(b) は code=VALIDATION_ERROR の isError 結果を返し A は superseded のまま変わらない"
    priority: must
    verify: test
    status: pending
    attempts: 0
