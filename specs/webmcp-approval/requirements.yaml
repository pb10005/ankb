# FEAT-011 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: docs/instructions.md（ankb 実装指示書）§10 ステップ8 / §6.2 / §7.2 / UC5
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-011
title: "WebMCP の承認フロー: エージェントはダイアログを開くまで、確定は人間のクリックだけ"
status: frozen # draft -> (spec-lint --gate freeze) -> frozen

intent: "ブラウザ内エージェントは承認ダイアログを開けても、置き換え関係を確定できてはならない（§2.2
  D、§6.2）。request_relation_approval
  が開いたダイアログは、人間の実際のクリックでだけ確定し、権限の無い提案・保留・中断・遷移のいずれでも提案の状態を変えない。"

out_of_scope:
  - "リアルタイム共同編集（指示書 §11）"
  - "外部サービス（Slack / Google Drive）からの自動取り込み（指示書 §11）"
  - "view / edit より細かいロール（指示書 §11）"
  - "ネイティブモバイルアプリ（指示書 §11）"
  - "ノートの物理削除。v1 は status=archived のみ（指示書 §11）"
  - "CDP 経由の isTrusted=true な合成入力による承認の偽装の防止（残存リスクとして AS-029 に記録）"
  - "複数の提案をまとめて承認するダイアログ（一括処理はインボックスで人間が行う）"

assumptions:
  - id: AS-029
    statement: "承認・却下のボタンは isTrusted=false のイベントを無視する。CDP 経由の合成入力は isTrusted=true
      になるため防げず、残存リスクとして受容する。WebMCP の仕様にユーザー確認API（Issue #165
      で議論中）が入った場合はそちらへ移行する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-082
    statement: "承認ダイアログは同時に1つだけ表示する。表示中に request_relation_approval
      が再度呼ばれた場合はダイアログを出さず {code: BUSY} を返し、提案は proposed のまま"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-10-10"

open_questions: []

acceptance:
