    kind: functional
    given: "proposed の提案 R"
    when: "エージェントが request_relation_approval(R) を execute する"
    then: "承認ダイアログを表示し、人間がクリックするまで R の state は proposed のまま変わらない"
    priority: must
    verify: test
    status: pass
    attempts: 0
    verified_at: 2026-09-26
    note: "ダイアログ表示(36) かつ1s後も proposed(38)。npx playwright test e2e/webmcp.spec.ts
      e2e/webmcp-approval.spec.ts: 19 passed / 2 failed(AC-069,AC-083 は環境要因)
      2026-09-26、provider.tsx の未コミット変更(abort 時の registerTool reject をログしない)込み"
