# FEAT-006 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: docs/instructions.md（ankb 実装指示書）§10 ステップ6 / §6.2 / UC3
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-006
title: "置き換え関係の推定と承認: AIが推定し人がワンクリックで承認する"
status: frozen # draft -> (spec-lint --gate freeze) -> frozen

intent: "どれが今有効かの判定を人手の整理に頼ると更新されない。ノートを有効にした時点でAIが置き換え・矛盾の候補を推定して提案し、両方のノートの編集権限を持つ人間がワンクリックで承認・却下できるようにする。承認だけが superseded への唯一の経路であり、エージェントは提案まではできても承認はできない。"

out_of_scope:
  - "リアルタイム共同編集（指示書 §11）"
  - "外部サービス（Slack / Google Drive）からの自動取り込み（指示書 §11）"
  - "view / edit より細かいロール（指示書 §11）"
  - "ネイティブモバイルアプリ（指示書 §11）"
  - "ノートの物理削除。v1 は status=archived のみ（指示書 §11）"
  - "提案の自動承認（確信度が高くても人間の承認を必須とする）"
  - "3ノート以上をまとめて統合する提案"
  - "提案の通知（メール・プッシュ）。ヘッダーの件数表示とインボックスだけで知らせる"

assumptions:
  - id: AS-020
    statement: "バックグラウンドジョブは Supabase Queues（pgmq）を使う。ノートの active 化・active ノートの本文更新のトリガーでジョブを投入する。即時の処理は AS-076 の after() が担い、取りこぼしは pg_cron が毎分ワーカーを呼んで回収する。Edge Functions（Deno）を使わないのは、検索・判定のコアロジックを Next.js 側の TypeScript と共有するため（指示書 §3 の選定報告）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-021
    statement: "候補数 N=5、確信度しきい値 0.7 は環境変数 ANKB_RELATION_TOP_N / ANKB_RELATION_THRESHOLD で変更できる初期値とする（指示書 §12: 運用で調整）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-023
    statement: "推定ジョブはサービスロールで動くが、ジョブが読むのはトリガー元ノートと同じ workspace のノートだけとする"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-043
    statement: "同じノートの組（向き・type を問わない）に proposed / confirmed / rejected のいずれかの note_relation がある場合、推定ジョブは新しい提案を作らない（AS-022 を置き換える）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-044
    statement: "LLM が『既存ノートがトリガー元ノートを置き換える』と判定した場合は from=既存ノート として保存し、バナー文言は『このノートは「X」に置き換えられていますか？』とする"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-074
    statement: "推定ジョブの試行は初回＋再試行3回の最大4回とする。LLM の失敗でメッセージを処理できなかった場合は即座に再試行し、4回目も失敗したら jobs.relation_job_failure に記録してキューから外す（アーカイブ）。ノートの保存はジョブの成否に関係なく成功する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-10"
  - id: AS-075
    statement: "『後で』は提案を proposed のまま残し、そのブラウザのセッション中だけノート画面のバナーを隠す（sessionStorage）。インボックスとヘッダーの件数には引き続き表示する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-10"
  - id: AS-076
    statement: "ノートの公開・保存の直後に、応答を返した後（Next.js の after）で推定キューを処理する。pg_cron による毎分の回収は、デプロイ時に jobs.configure_worker(ワーカーURL, 共有秘密) を実行して有効にする（共有秘密は環境変数 ANKB_WORKER_SECRET）。ジョブは DATABASE_URL の DB 接続で service_role に切り替えて動き（§5.3）、コードは src/jobs/ 配下に置く。判定モデルは環境変数 ANKB_RELATION_MODEL（既定 claude-opus-5、effort=low、fallbacks default）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-10"
  - id: AS-077
    statement: "E2E テストでは ANKB_TEST_MODE=1（かつ開発サーバか CI）のとき、タイトルの規則で判定する決定的な判定器を使う。タイトル末尾の識別子が同じ組について、『新・』と相手の『旧・』→ supersedes 0.9、両方に『矛盾』→ contradicts 0.8、それ以外は none"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-10"
  - id: AS-079
    statement: "ヘッダーの件数とインボックスは、自分が承認・却下できる（両方のノートを編集できる）未承認の提案だけを数える。インボックスの一括処理は既定で未選択とし、人間が選んだ提案だけを承認・却下する。related の提案はバナーで『このノートは「X」と関連していますか？』と尋ねる"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-10"

open_questions: []

