# FEAT-004 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: docs/instructions.md（ankb 実装指示書）§10 ステップ4 / §6.1
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-004
title: "検索パイプライン: ハイブリッド検索と有効性の解決 resolveCurrent()"
status: frozen # draft -> (spec-lint --gate freeze) -> frozen

intent: "同じテーマのノートが複数あるとどれが今有効か判別できない、という課題（§1.1）に対し、全入口で共通の検索関数が、ベクトル検索と全文検索の結果から置き換え済みのノートを本流から外し、旧情報・矛盾・更新の可能性を区別した SearchResult を返すようにする。検索は常に質問者のRLS下で実行する。"

out_of_scope:
  - "リアルタイム共同編集（指示書 §11）"
  - "外部サービス（Slack / Google Drive）からの自動取り込み（指示書 §11）"
  - "view / edit より細かいロール（指示書 §11）"
  - "ネイティブモバイルアプリ（指示書 §11）"
  - "ノートの物理削除。v1 は status=archived のみ（指示書 §11）"
  - "検索結果のファセット・絞り込みUI（日付・作成者での絞り込み）"
  - "ノート以外（議事録音声・添付ファイル）の検索"
  - "検索クエリの履歴保存・サジェスト"

assumptions:
  - id: AS-011
    statement: "日本語全文検索は PGroonga を採用する。Supabase が公式に提供する拡張であり、日本語の2文字語を分かち書き無しで検索できる。pg_bigm は Supabase のホスト環境で利用可能であることを確認できていないため採用しない（指示書 §12 のエンジニアリング判断）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-012
    statement: "チャンク化は見出し単位で分割し、1チャンク最大800文字・前後100文字の重なりを持たせる。チャンクと embedding はノートの保存時に同期的に作り直す"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-013
    statement: "ハイブリッド検索の統合は Reciprocal Rank Fusion（k=60）とし、再ランキングは RRF スコア順に effective_from・updated_at が新しいものを同点時に優先する。LLM による再ランキングは行わない。結果は hits 最大10件・superseded_context 最大5件とし、単位はチャンク（同じノートの複数チャンクが並ぶことがある）。質問の embedding 生成に失敗した場合は全文検索だけで結果を返す"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-014
    statement: "検索の本体は1つの TypeScript 関数 searchKnowledge(client, query) とし、Web UI の API・サーバMCP・WebMCP のすべてがこれを呼ぶ。client は質問者のJWTで作った Supabase クライアントで、サービスロールキーは使わない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-015
    statement: "conflicts の『同じテーマ』は contradicts 関係（confirmed または proposed）で直接結ばれていることと定義し、テーマの自動推定は行わない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-016
    statement: "CI の自動テストでは LLM と embedding の呼び出しを決定的なスタブに差し替える。実APIを使う評価テスト（AC-034、FEAT-005 の評価セット）は API キーがある環境でだけ実行する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-037
    statement: "possibly_outdated と conflicts は、関係の両端のノートを質問者が閲覧できる場合だけ立てる（§5.2-4）。置き換え先が見えない superseded だけは『より新しい版がある可能性』として superseded_context に残す（§6.1）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-039
    statement: "archived のノートは検索結果（hits / superseded_context）に含めない。クエリ展開の LLM 呼び出しは3秒でタイムアウトし、元のクエリだけで検索を続ける"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-040
    statement: "保存時の embedding 生成に失敗した場合もノートの保存は成功させ、chunk は embedding=null で保存して全文検索の対象にする。embedding はバックグラウンドジョブが補完する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-042
    statement: "サービスロールキーを読むコードは src/jobs/ 配下だけに置く（§5.3）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-068
    statement: "VOYAGE_API_KEY が無い環境（開発・CI）では、文字バイグラムのハッシュで作る決定的なスタブ embedding（1024次元）を使う。意味検索の品質は無く、ベクトル検索の経路と権限を検証するためだけに使う。本番では VOYAGE_API_KEY を必須とし、モデルは環境変数 ANKB_EMBEDDING_MODEL（既定 voyage-3.5、出力1024次元）で指定する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-069
    statement: "クエリ展開は claude-opus-5（環境変数 ANKB_QUERY_EXPANSION_MODEL で変更可）を effort=low・構造化出力（json_schema）で呼び、元の質問に最大3件の言い換えを加える。拒否に備えて server-side fallback（fallbacks: default）を付ける。ANTHROPIC_API_KEY が無い環境では展開しない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-070
    statement: "ベクトル検索はコサイン類似度 0.3 以上のチャンクだけを候補にする（環境変数 ANKB_VECTOR_MIN_SIMILARITY で変更可）。近傍検索は質問と無関係なチャンクも上位件数まで必ず返し、無関係なノートの矛盾・旧情報が結果に混ざるため"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"

