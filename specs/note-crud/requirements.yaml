# FEAT-003 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: docs/instructions.md（ankb 実装指示書）§10 ステップ3
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-003
title: "ノートのCRUDとエディタ: 作成・編集・公開範囲・共有・版履歴"
status: frozen # draft -> (spec-lint --gate freeze) -> frozen

intent: "美咲と健太が自分用のメモとチームに共有するノートを1つの場所で書き分けられるように、ノートの作成・編集・公開範囲の切り替え・ユーザー単位の共有・版履歴の閲覧をWeb UIで提供する。3種類の visibility がUIから設定でき、設定どおりに他のユーザーからの見え方が変わることを完了とする。"

out_of_scope:
  - "リアルタイム共同編集（指示書 §11）"
  - "外部サービス（Slack / Google Drive）からの自動取り込み（指示書 §11）"
  - "view / edit より細かいロール（指示書 §11）"
  - "ネイティブモバイルアプリ（指示書 §11）"
  - "ノートの物理削除。v1 は status=archived のみ（指示書 §11）"
  - "Markdown の WYSIWYG 編集。本文は Markdown のテキストエリアで編集し、表示時にレンダリングする"
  - "版履歴からの復元（巻き戻し）。版履歴は閲覧のみ"
  - "ノートへの画像・ファイル添付"
  - "タグ・フォルダによる分類"

assumptions:
  - id: AS-009
    statement: "UI上の visibility の表記は private=『非公開』、shared=『指定した人』、workspace=『チーム全体』とする。共有の権限の表記は view=『閲覧のみ』、edit=『編集できる』とする。専門用語をUIに出さない（ペルソナA）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-010
    statement: "title は1〜200文字、body は最大100,000文字（Unicodeコードポイント単位）とする"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-051
    statement: "閲覧できないノートは、すべての入口（Web UI・サーバMCP・WebMCP）で存在しない id と同じ応答（Web は 404 画面、MCP は NOT_FOUND）を返す"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-052
    statement: "ノートの更新は version による楽観ロックとし、保存時の version が最新でなければ CONFLICT として保存しない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-060
    statement: "共有先の候補は、呼び出し者が所属する workspace のメンバーだけを返すビュー workspace_directory（表示名とメールアドレス）から選ぶ。member テーブル自体は自分の行しか見えない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-061
    statement: "ノート作成時の workspace は、所属が1つならそれを使い、複数なら作成画面で選ばせる。ノートの状態の表記は draft=『下書き』、active=『有効』、superseded=『置き換え済み』、archived=『アーカイブ済み』とする"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-062
    statement: "ノート更新API は PATCH /api/notes/{id}（ログインセッションの cookie で認証）とし、200 / 400 VALIDATION_ERROR / 401 UNAUTHENTICATED（未ログイン）/ 403 FORBIDDEN / 404 NOT_FOUND / 409 CONFLICT を返す。title・body・effective_from・status・visibility と expected_version 以外のフィールドを送ると 403 を返す。Web UI の保存とこのAPIは同じ updateNote 関数を通す"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-067
    statement: "非公開（private）のノートで共有先を追加したら、公開範囲を『指定した人』（shared）に切り替える。非公開のままでは共有先が読めない（§5.1）ため"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-09-26"

open_questions: []

