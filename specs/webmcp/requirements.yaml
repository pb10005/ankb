# FEAT-008 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: docs/instructions.md（ankb 実装指示書）§10 ステップ8 / §7.2 / UC5
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-008
title: "WebMCP: ブラウザ内エージェントが画面の文脈を共有してUIを操作する"
status: frozen # draft -> (spec-lint --gate freeze) -> frozen

intent: "美咲がノートを開いたまま『これって最新？』と聞けるように、ankb のWebページ自身が document.modelContext（WebMCP）にツールを登録し、ブラウザ内エージェントが画面の文脈（開いているノート・検索クエリ・選択範囲）を取得し、ノートや比較ビューを開き、引用をハイライトできるようにする。確定操作（承認・保存）は必ず人間のクリックを経由する。"

out_of_scope:
  - "リアルタイム共同編集（指示書 §11）"
  - "外部サービス（Slack / Google Drive）からの自動取り込み（指示書 §11）"
  - "view / edit より細かいロール（指示書 §11）"
  - "ネイティブモバイルアプリ（指示書 §11）"
  - "ノートの物理削除。v1 は status=archived のみ（指示書 §11）"
  - "WebMCP 非対応ブラウザ向けの代替手段（拡張機能・ポリフィル）。非対応ブラウザでは人間向けUIだけが動く（AS-056）"
  - "ankb 自身がブラウザ内アシスタント（チャットUI）を提供すること。アシスタントはブラウザまたは拡張機能側が持つ"
  - "CDP 経由の isTrusted=true な合成入力による承認・保存の偽装の防止（残存リスクとして FEAT-011 AS-029 に記録）"

assumptions:
  - id: AS-031
    statement: "WebMCP は 2026-09-25 時点の仕様ドラフト（webmachinelearning/webmcp の index.bs、CG-DRAFT）に合わせる。エントリポイントは document.modelContext（SecureContext 必須）、登録は registerTool(tool, {signal})、解除は signal の abort、execute(input, {signal}) の戻り値は JSON シリアライズ可能なオブジェクト。読み取り系と画面操作のツールには annotations.readOnlyHint=true、request_relation_approval と draft_note には consequentialHint=true を付ける。document.modelContext が無い場合は何も登録しない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-028
    statement: "WebMCP の読み取り系ツールは、ブラウザのログインセッションで Web UI と同じ Next.js API（searchKnowledge を呼ぶもの）を呼ぶ。ブラウザからサービスロールキーやサーバMCPのOAuthトークンは使わない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-030
    statement: "E2E テストでは Playwright の addInitScript で document.modelContext のスタブ（registerTool(tool, {signal}) / getTools()）を注入し、登録・解除と execute の結果を検証する。加えて Chrome のフラグ enable-webmcp-testing を有効にした実ブラウザでのスモークテストを手動で1回行う"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-027
    statement: "WebMCP で登録するツールは、サーバMCPの読み取り系5件（search_knowledge / ask / get_note / get_note_lineage / list_pending_relations）、画面操作5件（get_current_context / open_note / open_compare_view / highlight_citation / draft_note）、request_relation_approval、propose_relation の計12件とする。propose_relation は §7.2 の表には無いが §6.2（WebMCP のエージェントも提案できる）に従って登録する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-053
    statement: "エディタに未保存の編集がある間、open_note と draft_note は画面を変えず UNSAVED_CHANGES を返す"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-056
    statement: "WebMCP 非対応ブラウザ向けの代替手段は用意しない。非対応ブラウザでは人間向けUI（質問欄の ask を含む）だけが動く（指示書 §12 の未決を既定値で仮決め）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"

