    kind: functional
    given: "決済サービス選定シナリオ（議事録3本・比較表・一度覆った判断）"
    when: "健太が『決済サービスをなぜA社にしたんだっけ？』を ask する"
    then: "citations を note の effective_from（無ければ作成日時）の昇順で並べ、覆った判断を引用する claim
      の直後に『この時点で判断が変わりました』を含み、最後の段落に現行の決定のマーカーを含む Answer を返す"
    priority: must
    verify: test
    status: pass
    attempts: 0
    verified_at: 2026-09-26
    note: stub が日付順を崩して返しても citations が effective_from
