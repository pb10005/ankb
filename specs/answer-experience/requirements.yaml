# FEAT-010 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: docs/instructions.md（ankb 実装指示書）§10 ステップ5 / §6.4 / UC2 / §9.3
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-010
title: "回答UIと経緯の再構成: 引用・旧情報・矛盾を画面で区別し、決定の経緯を時系列で示す"
status: frozen # draft -> (spec-lint --gate freeze) -> frozen

intent: "健太が『なぜそう決めたか』をたどれるように、経緯を問う質問には関連ノートを日付順に並べて判断が変わった時点を示し、美咲が回答の根拠をワンクリ\
  ックで確かめられるように、Web UI に引用・旧情報・矛盾を区別して表示する。回答の契約（FEAT-005）の上に乗る表示と形式の要件を扱う。"

out_of_scope:
  - "リアルタイム共同編集（指示書 §11）"
  - "外部サービス（Slack / Google Drive）からの自動取り込み（指示書 §11）"
  - "view / edit より細かいロール（指示書 §11）"
  - "ネイティブモバイルアプリ（指示書 §11）"
  - "ノートの物理削除。v1 は status=archived のみ（指示書 §11）"
  - "回答の会話履歴・ストリーミング表示・フィードバック収集"

assumptions:
  - id: AS-019
    statement: "『なぜ』『経緯』『いつから』を含む質問は timeline 形式として扱う。並び順は LLM の返す日付ではなく、引用ノートの
      effective_from（無ければ作成日時）でサーバが決める"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-048
    statement: "Anthropic API の呼び出しは30秒でタイムアウトし、1回だけ再試行する。構造化出力がスキーマに合わない場合も失敗として扱う"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-072
    statement: "Web UI の E2E テストでは、環境変数 ANKB_TEST_MODE=1 のときだけ決定的な合成器（資料の1行目を主張として返す
      Echo と、常に失敗する Failing。後者は cookie ankb-test-synth=fail
      で選ぶ）を使う。ANKB_TEST_MODE が無い本番では Claude を呼ぶ"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"

open_questions: []

